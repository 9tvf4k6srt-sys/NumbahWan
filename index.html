<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NumbahWan · 總書記廳 · 12月24日</title>
<meta name="theme-color" content="#1a120c" />

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#1a120c; --cream:#f4e8d4; --vermillion:#c41e1e; --gold:#c9a227;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--ink);color:var(--cream);line-height:1.4}
.stamp{
  position:fixed;z-index:60;top:.55rem;right:.55rem;
  background:var(--cream);color:var(--vermillion);border:2px solid var(--vermillion);
  font-weight:900;font-size:.62rem;line-height:1.15;padding:.3rem .45rem;text-align:center;
  transform:rotate(3deg);
}
.hero{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:flex-start;
  background:
    linear-gradient(180deg, rgba(26,18,12,.35), rgba(26,18,12,.92)),
    url("assets/v4/room-hero.png") center/cover no-repeat;
  padding:2.75rem .75rem 1.25rem;
}
.banner{
  align-self:center;background:var(--vermillion);color:var(--gold);
  font-weight:900;font-size:clamp(.75rem,2.8vw,1rem);
  padding:.45rem .9rem;border:2px solid var(--gold);margin-bottom:.75rem;text-align:center;
}
.mains{
  display:grid;grid-template-columns:1fr 1fr;gap:.55rem;
  width:min(100%,42rem);margin:0 auto;flex:1;align-content:center;
}
.mains figure{
  margin:0;background:#0c0805;
  border:3px solid var(--gold);box-shadow:0 0 0 2px #5a4208, 4px 6px 0 rgba(0,0,0,.45);
  display:flex;flex-direction:column;
}
.mains img{
  width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;display:block;
  background:#2a2a2a;
}
.mains figcaption{
  padding:.35rem .4rem;font-size:clamp(.65rem,2.5vw,.8rem);font-weight:900;
  background:rgba(0,0,0,.75);text-align:center;color:var(--gold);
}
.scrim{
  width:min(100%,42rem);margin:.85rem auto 0;
}
.scrim h1{margin:0 0 .25rem;font-size:clamp(1.2rem,4.5vw,1.85rem);font-weight:900}
.scrim p{margin:0 0 .65rem;font-size:.9rem;opacity:.92}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .85rem;font-size:.78rem;opacity:.88;margin-bottom:.7rem}
.meta strong{color:var(--gold)}
.cta{
  display:inline-block;background:var(--vermillion);color:var(--cream);
  text-decoration:none;font-weight:900;padding:.6rem .95rem;border:2px solid var(--gold);
}
.cta:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{max-width:42rem;margin:0 auto;padding:1.25rem .85rem 2rem}
.panel h2{margin:0 0 .5rem;font-size:1.05rem;font-weight:900;color:var(--gold)}
.evidence{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.evidence figure{margin:0;border:1px solid #5a4208;background:#0c0805}
.evidence img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;object-position:center top}
.evidence figcaption{padding:.35rem;font-size:.68rem;opacity:.85}
footer{max-width:42rem;margin:0 auto;padding:0 .85rem 2rem;font-size:.68rem;opacity:.65}
@media (max-width:420px){
  .mains{gap:.4rem}
  .mains figcaption{font-size:.62rem;padding:.28rem}
}
</style>
</head>
<body>

        <figcaption>總書記 · RegginA</figcaption>

        <figcaption>副書記 · RegginO</figcaption>

  </section>
